<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night at the Meridian Museum — a stealth game</title>
<style>
  html, body { margin: 0; padding: 0; background: #0d0a14; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { width: 1280px; height: 720px; max-width: 100vw; max-height: 100vh; background: #b8a88a; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #selftest { position: absolute; left: -9999px; top: 0; color: #fff; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<p class="visually-hidden" id="status">Night at the Meridian Museum: a top-down stealth game. Move with WASD or the arrow keys, sneak with Shift, or click to walk. Avoid the guards' vision cones, hide behind the display cases, and reach the exit unseen.</p>
<pre id="selftest"></pre>
<script type="module" src="./src/main.js"></script>
</body>
</html>
