<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Night at the Meridian Museum — a stealth game</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; background: #0c0e13; min-height: 100%; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: system-ui, sans-serif; }
  canvas { width: min(100vw, 1280px); height: auto; display: block; background: #0c0e13; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Night at the Meridian Museum, a top-down stealth game"></canvas>
<p id="status" class="visually-hidden" aria-live="polite">Loading…</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
